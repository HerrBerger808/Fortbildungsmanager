# Apache2 VirtualHost – Fortbildungsmanager
# Kopieren nach: /etc/apache2/sites-available/fortbildungsmanager.conf
# Aktivieren mit: a2ensite fortbildungsmanager && systemctl reload apache2

<VirtualHost *:80>
    ServerName fortbildungsmanager.example.com
    # ServerAlias www.fortbildungsmanager.example.com

    DocumentRoot /var/www/fortbildungsmanager

    <Directory /var/www/fortbildungsmanager>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Protect sensitive directories
    <Directory /var/www/fortbildungsmanager/config>
        Require all denied
    </Directory>
    <Directory /var/www/fortbildungsmanager/src>
        Require all denied
    </Directory>
    <Directory /var/www/fortbildungsmanager/sql>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/fortbildungsmanager_error.log
    CustomLog ${APACHE_LOG_DIR}/fortbildungsmanager_access.log combined
</VirtualHost>

