# Apache2 VirtualHost – Fortbildungsmanager (Subdomain-Betrieb)
# Beispiel: fobi.meinedomain.de
#
# 1. Datei kopieren nach:
#      /etc/apache2/sites-available/fobi.conf
# 2. Aktivieren:
#      a2ensite fobi && systemctl reload apache2
# 3. SSL-Zertifikat (Let's Encrypt):
#      certbot --apache -d fobi.meinedomain.de
#
# Benötigte Apache-Module:
#   a2enmod rewrite headers ssl

# ── HTTP → HTTPS Weiterleitung ────────────────────────────────────────
<VirtualHost *:80>
    ServerName fobi.meinedomain.de

    # Let's-Encrypt-Verzeichnis ausschließen, alles andere auf HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# ── HTTPS ─────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName fobi.meinedomain.de

    # DocumentRoot zeigt direkt auf das App-Verzeichnis (kein Unterordner!)
    DocumentRoot /var/www/fobi

    SSLEngine on
    # Zertifikatspfade werden von certbot automatisch eingetragen:
    SSLCertificateFile    /etc/letsencrypt/live/fobi.meinedomain.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/fobi.meinedomain.de/privkey.pem

    # Moderne TLS-Konfiguration
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    <Directory /var/www/fobi>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Sensitive Verzeichnisse sperren
    <Directory /var/www/fobi/config>
        Require all denied
    </Directory>
    <Directory /var/www/fobi/src>
        Require all denied
    </Directory>
    <Directory /var/www/fobi/sql>
        Require all denied
    </Directory>
    <Directory /var/www/fobi/setup>
        Require all denied
    </Directory>

    # HSTS (nach erfolgreicher HTTPS-Einrichtung aktivieren)
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/fobi_error.log
    CustomLog ${APACHE_LOG_DIR}/fobi_access.log combined
</VirtualHost>
